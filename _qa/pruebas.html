<html lang="es">
<head>

  h1 { font-size: 18px; } h2 { font-size: 15px; margin-top: 24px; }

<body>
<h1>Pruebas automáticas de Pivote</h1>

<div id="resultados"></div>
<script src="../js/estimador.js"></script>
<script src="../js/cotizar-logica.js"></script>
<script>
/* Ejecutor mínimo: prueba(grupo, nombre, fn). fn puede devolver una promesa. */
var PRUEBAS = [];
function prueba(grupo, nombre, fn) { PRUEBAS.push({ grupo: grupo, nombre: nombre, fn: fn }); }
function igual(obtenido, esperado, detalle) {
  if (JSON.stringify(obtenido) !== JSON.stringify(esperado)) throw new Error((detalle ? detalle + ': ' : '') + 'se esperaba ' + JSON.stringify(esperado) + ' y se obtuvo ' + JSON.stringify(obtenido));
}
function cierto(v, detalle) { if (!v) throw new Error(detalle || 'se esperaba verdadero'); }

/* ---- 1. Estimador (HANDOFF §7.4, CONTENT §8) ---------------------------- */
var E = function (e) { return window.Estimador.estimar(e); };
var CASOS = [
  [{ area: 48, rubro: 'cafeteria', servicio: 'obra', estado: 'vacio', cierre: 'noche', centroComercial: 'no' }, 'S/ 77,000 – 118,000'],
  [{ area: 48, rubro: 'botica', servicio: 'proyecto', estado: 'vacio', cierre: null, centroComercial: 'no' }, 'S/ 3,700 – 5,800'],
  [{ area: 32, rubro: 'tienda', servicio: 'obra', estado: 'funcionamiento', cierre: 'abierto', centroComercial: 'no' }, 'S/ 40,000 – 61,000'],
  [{ area: 60, rubro: 'salon', servicio: 'obra', estado: 'vacio', cierre: null, centroComercial: 'si' }, 'S/ 83,000 – 126,000'],
  [{ area: 40, rubro: 'tienda', servicio: 'diagnostico', estado: 'funcionamiento', cierre: null, centroComercial: 'no' }, 'S/ 900 – 1,300'],
  [{ area: 120, rubro: 'cafeteria', servicio: 'diagnostico', estado: 'funcionamiento', cierre: null, centroComercial: 'no' }, 'S/ 2,400 – 3,400'],
  [{ area: 30, rubro: 'tienda', servicio: 'obra', estado: 'funcionamiento', cierre: 'total', centroComercial: 'no' }, 'S/ 32,000 – 49,000'],
  [{ area: 90, rubro: 'salon', servicio: 'obra', estado: 'vacio', cierre: 'abierto', centroComercial: 'si' }, 'S/ 147,000 – 225,000'],
  [{ area: null, rubro: 'cafeteria', servicio: 'obra', estado: 'sinlocal', cierre: null, centroComercial: 'no' }, 'S/ 1,330 – 2,030 por m²']
];
CASOS.forEach(function (c, i) {
  prueba('Estimador · 9 casos del handoff', (i + 1) + '. ' + JSON.stringify(c[0]), function () { igual(E(c[0]).cifra, c[1]); });
});
prueba('Estimador · textos', 'Explicación del ejemplo de CONTENT §7.5', function () {
  igual(E(CASOS[0][0]).explica, 'Calculado con 48 m² × diseño + obra × cafetería × local vacío × obra de noche. Es una referencia, no un presupuesto: el monto final sale de la visita y del proyecto. No incluye equipos de cocina ni mercadería.');
});
prueba('Estimador · textos', 'Diagnóstico menciona el descuento (D-024)', function () {
  cierto(/descontamos el diagnóstico/.test(E(CASOS[4][0]).explica));
});
prueba('Estimador · casos especiales', '«Aún no lo sé» usa diseño + obra y añade el rango del proyecto', function () {
  var r = E({ area: 48, rubro: 'cafeteria', servicio: 'nose', estado: 'vacio', cierre: 'noche', centroComercial: 'no' });
  igual(r.cifra, 'S/ 77,000 – 118,000');
  cierto(/Si solo es el proyecto de diseño: S\/ 4,400 – 6,900/.test(r.explica), r.explica);
});
prueba('Estimador · casos especiales', '«Aún sin local» con «Aún no lo sé» da la referencia por m²', function () {
  igual(E({ area: null, rubro: 'tienda', servicio: 'nose', estado: 'sinlocal', cierre: null, centroComercial: 'no' }).cifra, 'S/ 1,020 – 1,560 por m²');
});
prueba('Estimador · casos especiales', '«Aún sin local» no activa el aviso de presupuesto', function () {
  igual(E({ area: null, rubro: 'tienda', servicio: 'obra', estado: 'sinlocal' }).minParaAviso, 0);
});
prueba('Estimador · bordes', 'A = 10 es válido', function () { cierto(E({ area: 10, rubro: 'tienda', servicio: 'diagnostico' }).cifra); });
prueba('Estimador · bordes', 'A = 9.9 no da cifra', function () { igual(E({ area: 9.9, rubro: 'tienda', servicio: 'diagnostico' }).cifra, null); });
prueba('Estimador · bordes', 'A = 1,000 es válido', function () { cierto(E({ area: 1000, rubro: 'tienda', servicio: 'obra', estado: 'vacio' }).cifra); });
prueba('Estimador · bordes', 'A = 1,001 no da cifra y lo explica', function () {
  var r = E({ area: 1001, rubro: 'tienda', servicio: 'obra', estado: 'vacio' });
  igual(r.cifra, null); cierto(/1,000 m²/.test(r.explica), r.explica);
});
prueba('Estimador · bordes', 'Sin área: texto de CONTENT §7.5', function () {
  igual(E({ area: null, rubro: 'tienda', servicio: 'obra', estado: 'vacio' }).explica, 'Para calcular un rango necesitamos el área aproximada.');
});
prueba('Estimador · bordes', 'Sin cierre = factor 1.00 (igual que «cierre total»)', function () {
  var base = { area: 48, rubro: 'tienda', servicio: 'obra', estado: 'vacio', centroComercial: 'no' };
  igual(E(Object.assign({}, base, { cierre: null })).cifra, E(Object.assign({}, base, { cierre: 'total' })).cifra);
});
prueba('Estimador · bordes', 'Centro comercial ×1.08 cambia la obra', function () {
  var base = { area: 48, rubro: 'tienda', servicio: 'obra', estado: 'vacio', cierre: 'total' };
  cierto(E(Object.assign({}, base, { centroComercial: 'si' })).min > E(Object.assign({}, base, { centroComercial: 'no' })).min);
});
prueba('Estimador · redondeo', 'A 100 por debajo de 10,000; a 500 hasta 20,000; a 1,000 por encima', function () {
  var R = window.Estimador.redondear;
  igual([R(9949), R(9950), R(10249), R(10250), R(20250), R(20499), R(20500)], [9900, 10000, 10000, 10500, 20000, 20000, 21000]);
});
prueba('Estimador · formato', 'Coma de miles y guion corto con espacios', function () {
  igual(window.Estimador.formatoRango(77000, 118000), 'S/ 77,000 – 118,000');
});
prueba('Estimador · aviso de presupuesto', 'Tope menor que el mínimo → aviso; «más de 100,000» y «prefiero no decirlo» → nunca', function () {
  var A = window.Estimador.avisoPresupuesto;
  igual([A('hasta20', 77000), A('20a50', 77000), A('50a100', 77000), A('mas100', 77000), A('nd', 77000), A('50a100', 40000), A('hasta20', 0)], [true, true, false, false, false, false, false]);
});

/* ---- 2. Lógica de Cotizar (HANDOFF §7.2–7.3, CONTENT §7) ---------------- */
var L = window.CotizarLogica;
var HOY = new Date(2026, 8, 24); // 24 de septiembre de 2026
function base(extra) { return Object.assign(L.estadoInicial(), extra || {}); }
prueba('Cotizar · paso 1', 'Sin rubro ni servicio: dos errores con los textos de CONTENT §7.1', function () {
  var v = L.validar(1, base());
  igual(v.errores, { rubro: 'Elige el tipo de negocio para continuar.', servicio: 'Elige qué necesitas. “Aún no lo sé” también vale.' });
});
prueba('Cotizar · paso 1', 'Con rubro y servicio, sin errores', function () { igual(L.validar(1, base({ rubro: 'botica', servicio: 'nose' })).errores, {}); });
prueba('Cotizar · paso 2', 'Área, distrito y estado son obligatorios (DC-002)', function () {
  igual(Object.keys(L.validar(2, base()).errores), ['area', 'distrito', 'estado']);
});
prueba('Cotizar · paso 2', 'Área: vacía, < 10, decimales con coma y > 1,000 (aviso que no bloquea)', function () {
  igual(L.validar(2, base({ area: '', distrito: 'Lince', estado: 'vacio' })).errores.area, 'Indica el área aproximada en m².');
  igual(L.validar(2, base({ area: '8', distrito: 'Lince', estado: 'vacio' })).errores.area, 'El área parece muy pequeña. Revisa el número (en m²).');
  igual(L.validar(2, base({ area: '48,5', distrito: 'Lince', estado: 'vacio' })).errores, {});
  var g = L.validar(2, base({ area: '1200', distrito: 'Lince', estado: 'vacio' }));
  igual([g.errores, g.avisos.area], [{}, 'Para más de 1,000 m² preferimos conversarlo. Puedes seguir sin rango.']);
});
prueba('Cotizar · paso 2', 'Área con letras cuenta como vacía', function () { igual(L.numeroArea('48 m2'), null); });
prueba('Cotizar · paso 3', 'Fecha pasada: error con el mes actual', function () {
  igual(L.validar(3, base({ fecha: '2026-08' }), HOY).errores.fecha, 'Esa fecha ya pasó. Elige un mes a partir de Septiembre 2026.');
});
prueba('Cotizar · paso 3', 'Menos de 8 semanas con diseño + obra: aviso que no bloquea', function () {
  var v = L.validar(3, base({ fecha: '2026-10', servicio: 'obra' }), HOY);
  igual([v.errores, v.avisos.fecha], [{}, 'Es un plazo corto para diseño + obra. Te diremos qué es posible en la visita.']);
  igual(L.validar(3, base({ fecha: '2026-10', servicio: 'proyecto' }), HOY).avisos, {});
  igual(L.validar(3, base({ fecha: '2027-03', servicio: 'obra' }), HOY).avisos, {});
});
prueba('Cotizar · paso 3', 'Todo opcional: sin datos no hay errores', function () { igual(L.validar(3, base(), HOY).errores, {}); });
prueba('Cotizar · paso 4', 'Nombre, teléfono y privacidad obligatorios', function () {
  igual(Object.keys(L.validar(4, base()).errores), ['nombre', 'telefono', 'privacidad']);
});
prueba('Cotizar · paso 4', 'Teléfono: 9 dígitos que empiezan con 9; se ignoran los espacios', function () {
  var t = function (x) { return !!L.validar(4, base({ nombre: 'A', privacidad: true, telefono: x })).errores.telefono; };
  igual([t('912 345 678'), t('912345678'), t('812345678'), t('91234567'), t('9123456789')], [false, false, true, true, true]);
});
prueba('Cotizar · paso 4', 'Correo: opcional, pero obligatorio y válido si la preferencia es «Correo»', function () {
  var ok = { nombre: 'A', telefono: '912345678', privacidad: true };
  igual(L.validar(4, base(ok)).errores, {});
  igual(L.validar(4, base(Object.assign({ preferencia: 'correo' }, ok))).errores.correo, 'Revisa el correo: falta la @ o el dominio.');
  igual(L.validar(4, base(Object.assign({ correo: 'nombre@example' }, ok))).errores.correo, 'Revisa el correo: falta la @ o el dominio.');
  igual(L.validar(4, base(Object.assign({ correo: 'nombre@example.com', preferencia: 'correo' }, ok))).errores, {});
});
prueba('Cotizar · textos', 'Resumen de errores en singular y plural', function () {
  igual([L.tituloResumenErrores(1), L.tituloResumenErrores(3)], ['Revisa 1 campo antes de continuar', 'Revisa 3 campos antes de continuar']);
});
prueba('Cotizar · resumen', 'Filas con el formato del prototipo (HANDOFF §7.5)', function () {
  var f = L.filasResumen(base({ rubro: 'cafeteria', servicio: 'obra', area: '48', distrito: 'Miraflores', estado: 'vacio', fecha: '2027-03', cierre: 'noche', presupuesto: '20a50', nombre: 'Rosa', telefono: '912345678' }));
  igual(f, { rubroServicio: 'Cafetería · Diseño + obra', local: '48 m² · Miraflores · local vacío · a la calle', plazo: 'Marzo 2027 · obra de noche · S/ 20,000 – 50,000', contacto: 'Rosa · 912 345 678 · WhatsApp' });
});
prueba('Cotizar · resumen', 'Sin fecha y sin cierre', function () {
  igual(L.filasResumen(base({ sinFecha: true, presupuesto: 'nd' })).plazo, 'Sin fecha · cierre por definir · presupuesto sin indicar');
});
prueba('Cotizar · resumen', 'Resumen corto de la confirmación (CONTENT §7.6)', function () {
  igual(L.resumenCorto(base({ rubro: 'cafeteria', servicio: 'obra', area: '48', distrito: 'Miraflores' })), 'Cafetería · 48 m² · Miraflores · Diseño + obra');
});
prueba('Cotizar · datos', '43 distritos de Lima + Callao + Otro', function () { igual(L.DISTRITOS.length, 45); igual(L.DISTRITOS.slice(-2), ['Callao', 'Otro']); });
prueba('Cotizar · datos', 'Estado inicial: centro comercial «no» y preferencia «WhatsApp» preseleccionados', function () {
  var e = L.estadoInicial(); igual([e.centroComercial, e.preferencia, e.enviado], ['no', 'whatsapp', false]);
});

/* ---- 3. Cotizar en el navegador (iframe) --------------------------------- */
function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var marco = null;
function cargar(url) {
  return new Promise(function (resolver) {
    if (!marco) { marco = document.createElement('iframe'); marco.style.cssText = 'width:1280px;height:900px;position:absolute;left:-9999px;top:0'; document.body.appendChild(marco); }
    marco.onload = function () { setTimeout(function () { resolver(marco.contentWindow); }, 150); };
    // Parámetro único: una URL que solo cambia el #fragmento no recarga el iframe
    var partes = url.split('#'); cargar.n = (cargar.n || 0) + 1;
    marco.src = partes[0] + (partes[0].indexOf('?') >= 0 ? '&' : '?') + 'recarga=' + cargar.n + (partes[1] ? '#' + partes[1] : '');
  });
}
function vis(w) { var v = w.document.querySelector('[data-vista]:not([hidden])'); return v && v.getAttribute('data-vista'); }
function marcar(w, nombre, valor) { var el = w.document.querySelector('input[name="' + nombre + '"][value="' + valor + '"]'); el.click(); }
function escribir(w, nombre, valor) { var el = w.document.querySelector('[name="' + nombre + '"]'); el.value = valor; el.dispatchEvent(new w.Event(el.tagName === 'SELECT' ? 'change' : 'input', { bubbles: true })); el.dispatchEvent(new w.Event('change', { bubbles: true })); }
function accion(w, a) { w.document.querySelector('[data-vista]:not([hidden]) [data-accion="' + a + '"]').click(); }
function texto(w, sel) { return w.document.querySelector(sel).textContent.trim(); }

prueba('Cotizar · recorrido', '?nueva=1 empieza de cero en el paso 1', function () {
  return cargar('../cotizar.html?nueva=1').then(function (w) {
    igual([vis(w), w.location.hash, w.location.search], ['paso-1', '#paso-1', '']);  // ?nueva y ?recarga se retiran
    igual(JSON.parse(w.sessionStorage.getItem('pivote.cotizacion')).rubro, null);
  });
});
prueba('Cotizar · recorrido', 'Continuar sin datos: resumen de errores con foco y 2 enlaces', function () {
  var w = marco.contentWindow; accion(w, 'continuar');
  return espera(50).then(function () {
    var r = w.document.querySelector('[data-vista="paso-1"] [data-resumen-errores]');
    igual([r.hidden, texto(w, '[data-vista="paso-1"] [data-titulo]'), r.querySelectorAll('a').length, w.document.activeElement === r], [false, 'Revisa 2 campos antes de continuar', 2, true]);
    igual(texto(w, '#error-rubro'), 'Elige el tipo de negocio para continuar.');
    igual(w.document.querySelector('input[name="rubro"]').getAttribute('aria-invalid'), 'true');
  });
});
prueba('Cotizar · recorrido', 'Elegir rubro y servicio: el error desaparece y el panel se actualiza', function () {
  var w = marco.contentWindow; marcar(w, 'rubro', 'cafeteria'); marcar(w, 'servicio', 'obra');
  return espera(50).then(function () {
    igual([w.document.querySelector('#error-rubro').hidden, texto(w, '[data-panel="rubro"]'), texto(w, '[data-panel="servicio"]')], [true, 'Cafetería', 'Diseño + obra']);
    accion(w, 'continuar'); return espera(80);
  }).then(function () { igual(vis(w), 'paso-2'); igual(w.document.activeElement.id, 'h-paso-2'); });
});
prueba('Cotizar · recorrido', 'Paso 2: texto de DC-002 y tres errores; «Otro» distrito de la lista completa', function () {
  var w = marco.contentWindow; accion(w, 'continuar');
  return espera(50).then(function () {
    igual(texto(w, '[data-vista="paso-2"] [data-texto]'), 'Completa el área, el distrito y el estado del local para continuar.');
    igual(w.document.querySelectorAll('[data-vista="paso-2"] [data-resumen-errores] a').length, 3);
    igual(w.document.querySelectorAll('#campo-distrito option').length, 46);
    escribir(w, 'area', '48'); escribir(w, 'distrito', 'Miraflores'); marcar(w, 'estado', 'vacio');
    return espera(50);
  }).then(function () {
    igual(texto(w, '[data-panel="local"]'), '48 m² · Miraflores');
    accion(w, 'continuar'); return espera(80);
  }).then(function () { igual(vis(w), 'paso-3'); });
});
prueba('Cotizar · recorrido', 'Paso 3: «Aún no tengo fecha» vacía la fecha; se puede continuar', function () {
  var w = marco.contentWindow; escribir(w, 'fecha', '2027-03');
  var sin = w.document.querySelector('input[name="sinFecha"]'); sin.click();
  return espera(30).then(function () {
    igual(w.document.querySelector('[name="fecha"]').value, '');
    sin.click(); escribir(w, 'fecha', '2027-03'); marcar(w, 'cierre', 'noche'); marcar(w, 'presupuesto', 'hasta20');
    return espera(30);
  }).then(function () { igual(w.document.querySelector('input[name="sinFecha"]').checked, false); accion(w, 'continuar'); return espera(80); })
    .then(function () { igual(vis(w), 'paso-4'); });
});
prueba('Cotizar · recorrido', 'Paso 4: errores de nombre, teléfono y privacidad; luego al resumen', function () {
  var w = marco.contentWindow; accion(w, 'revisar');
  return espera(50).then(function () {
    igual(w.document.querySelectorAll('[data-vista="paso-4"] [data-resumen-errores] a').length, 3);
    escribir(w, 'nombre', 'Rosa'); escribir(w, 'telefono', '912 345 678'); w.document.querySelector('[name="privacidad"]').click();
    return espera(30);
  }).then(function () { accion(w, 'revisar'); return espera(80); }).then(function () { igual(vis(w), 'resumen'); });
});
prueba('Cotizar · resumen', 'Rango, explicación, aviso de presupuesto y filas', function () {
  var w = marco.contentWindow;
  igual(texto(w, '[data-rango-cifra]'), 'S/ 77,000 – 118,000');
  cierto(/No incluye equipos de cocina ni mercadería\.$/.test(texto(w, '[data-rango-explica]')));
  igual(w.document.querySelector('[data-aviso-presupuesto]').hidden, false);
  igual([texto(w, '[data-fila="rubroServicio"]'), texto(w, '[data-fila="local"]'), texto(w, '[data-fila="plazo"]'), texto(w, '[data-fila="contacto"]')],
    ['Cafetería · Diseño + obra', '48 m² · Miraflores · local vacío · a la calle', 'Marzo 2027 · obra de noche · hasta S/ 20,000', 'Rosa · 912 345 678 · WhatsApp']);
  igual(w.document.querySelector('[data-panel-zona]').hidden, true);
});
prueba('Cotizar · resumen', '«¿Cómo lo calculamos?» abre y cierra la explicación', function () {
  var w = marco.contentWindow, b = w.document.querySelector('[data-como]'); b.click();
  igual([b.getAttribute('aria-expanded'), w.document.querySelector('#como-calculamos').hidden], ['true', false]); b.click();
});
prueba('Cotizar · persistencia', '«Editar» lleva al paso con los datos; al recargar se conserva todo', function () {
  var w = marco.contentWindow; w.document.querySelector('[data-editar][href="#paso-2"]').click();
  return espera(80).then(function () {
    igual([vis(w), w.document.querySelector('[name="area"]').value, w.document.querySelector('[name="distrito"]').value], ['paso-2', '48', 'Miraflores']);
    return cargar('../cotizar.html#resumen');
  }).then(function (w2) { igual(vis(w2), 'resumen'); igual(texto(w2, '[data-rango-cifra]'), 'S/ 77,000 – 118,000'); });
});
prueba('Cotizar · envío', 'Enviar: «Enviando…» deshabilitado, sin doble envío, confirmación a los ~1000 ms', function () {
  var w = marco.contentWindow, b = w.document.querySelector('[data-accion="enviar"]'); b.click(); b.click();
  return espera(300).then(function () {
    igual([vis(w), b.disabled, b.getAttribute('aria-busy'), texto(w, '[data-etiqueta-enviar]')], ['resumen', true, 'true', 'Enviando…']);
    return espera(1000);
  }).then(function () {
    igual(vis(w), 'confirmacion');
    igual(texto(w, '[data-resumen-corto]'), 'Cafetería · 48 m² · Miraflores · Diseño + obra');
    igual(texto(w, '[data-confirmacion-rango]'), 'S/ 77,000 – 118,000');
    igual(w.document.querySelector('[data-accion="salir"]').hidden, true);
  });
});
prueba('Cotizar · envío', 'Tras enviar, volver al resumen redirige a la confirmación', function () {
  var w = marco.contentWindow; w.location.hash = 'resumen';
  return espera(80).then(function () { igual(vis(w), 'confirmacion'); });
});
prueba('Cotizar · envío', '«Nueva cotización» vacía el estado y vuelve al paso 1', function () {
  var w = marco.contentWindow; w.document.querySelector('[data-accion="nueva"]').click();
  return espera(80).then(function () {
    igual([vis(w), JSON.parse(w.sessionStorage.getItem('pivote.cotizacion')).rubro, w.document.querySelector('input[name="rubro"]:checked')], ['paso-1', null, null]);
  });
});
prueba('Cotizar · entradas', '?servicio=obra y ?rubro=botica llegan preseleccionados', function () {
  return cargar('../cotizar.html?servicio=obra').then(function (w) {
    igual(w.document.querySelector('input[name="servicio"]:checked').value, 'obra');
    return cargar('../cotizar.html?rubro=botica');

/* ---- 4. Páginas: cabecera y pie (T-2), metadatos y enlaces --------------- */
var PAGINAS = ['index.html', 'servicios.html', 'proyectos.html', 'proyectos/botica-de-barrio.html', 'proyectos/floreria-en-barranco.html', 'proyectos/barberia-con-espera-a-la-vista.html', 'proyectos/cafeteria-de-paso.html', 'como-trabajamos.html', 'estudio.html', 'sobre.html', 'privacidad.html', '404.html'];
var TODAS = PAGINAS.concat(['cotizar.html']);
var docs = {};
function doc(p) { if (docs[p]) return Promise.resolve(docs[p]); return fetch('../' + p).then(function (r) { if (!r.ok) throw new Error(p + ' → ' + r.status); return r.text(); }).then(function (t) { docs[p] = new DOMParser().parseFromString(t, 'text/html'); return docs[p]; }); }
function normalizar(el) {
  var c = el.cloneNode(true);
  c.querySelectorAll('[aria-current]').forEach(function (n) { n.removeAttribute('aria-current'); });
  return c.outerHTML.replace(/(href|src)="(\.\.\/)+/g, '$1="').replace(/\s+/g, ' ');
}
var BLOQUES = { 'cabecera': 'header.cabecera', 'menú móvil': '#menu-movil', 'pie': 'footer.pie', 'aviso de contacto': '[data-aviso-contacto]' };
Object.keys(BLOQUES).forEach(function (nombre) {

    return Promise.all(PAGINAS.map(doc)).then(function (ds) {
      var ref = normalizar(ds[0].querySelector(BLOQUES[nombre]));
      ds.forEach(function (d, i) { var el = d.querySelector(BLOQUES[nombre]); cierto(el, PAGINAS[i] + ': falta ' + nombre); if (normalizar(el) !== ref) throw new Error(PAGINAS[i] + ': ' + nombre + ' distinto de index.html'); });
    });
  });
});

  return Promise.all(PAGINAS.map(doc)).then(function (ds) {

      var nav = Array.prototype.map.call(d.querySelectorAll('.cabecera__enlaces a'), function (a) { return a.getAttribute('href').replace(/^(\.\.\/)+/, '') + '|' + a.textContent; });
      igual(nav, ['servicios.html|Servicios', 'proyectos.html|Proyectos', 'como-trabajamos.html|Cómo trabajamos', 'estudio.html|Estudio'], PAGINAS[i]);
    });
  });
});

      igual(d.querySelectorAll('[aria-current="page"]').length, e ? 3 : (p === 'sobre.html' || p === 'privacidad.html' ? 1 : 0), p + ' (cabecera + menú móvil + pie, o solo pie)');
    });

});
prueba('Metadatos', 'lang, título, descripción, noindex, OG común y favicons en las 13 páginas', function () {
  return Promise.all(TODAS.map(doc)).then(function (ds) {
    var og = null;
    ds.forEach(function (d, i) {
      var p = TODAS[i], q = function (s) { var e = d.querySelector(s); return e && (e.getAttribute('content') || e.getAttribute('href')); };
      igual(d.documentElement.getAttribute('lang'), 'es-PE', p);
      cierto(d.title && / — Pivote|^Pivote — /.test(d.title), p + ': título');
      cierto(q('meta[name="description"]'), p + ': descripción');
      igual(q('meta[name="robots"]'), 'noindex, nofollow', p);
      og = og || q('meta[property="og:image"]'); igual(q('meta[property="og:image"]'), og, p + ': og:image');
      cierto(/^https:\/\//.test(og), 'og:image absoluta');
      cierto(q('meta[property="og:image:alt"]') && q('meta[name="twitter:card"]') === 'summary_large_image', p + ': og alt / twitter');
      cierto(q('link[rel="icon"][type="image/svg+xml"]') && q('link[rel="manifest"]'), p + ': favicon y manifest');
      igual(d.querySelectorAll('h1').length, p === 'cotizar.html' ? 6 : 1, p + ': h1');
      igual(d.querySelectorAll('link[href*="fonts.googleapis"], link[href*="fonts.gstatic"]').length, 0, p + ': sin Google Fonts');
    });

});
prueba('Enlaces', 'Todos los recursos y enlaces internos responden (href, src, srcset, use)', function () {
  return Promise.all(TODAS.map(doc)).then(function (ds) {
    var urls = {};
    ds.forEach(function (d, i) {
      var p = TODAS[i], base = new URL('../' + p, location.href);
      if (p === '404.html') base = new URL('../', location.href);
      d.querySelectorAll('a[href], link[href], img[src], script[src], use[href], img[srcset]').forEach(function (el) {
        var vals = [];
        ['href', 'src'].forEach(function (a) { if (el.getAttribute(a)) vals.push(el.getAttribute(a)); });
        if (el.getAttribute('srcset')) el.getAttribute('srcset').split(',').forEach(function (s) { vals.push(s.trim().split(' ')[0]); });
        vals.forEach(function (v) {
          if (/^(https?:|mailto:|tel:|#|javascript:)/.test(v)) return;
          var u = new URL(v, base); u.hash = ''; u.search = '';
          (urls[u.href] = urls[u.href] || []).push(p);
        });
      });
    });
    var lista = Object.keys(urls);
    return Promise.all(lista.map(function (u) { return fetch(u, { method: 'GET' }).then(function (r) { return r.ok ? null : u + ' (' + r.status + ') en ' + urls[u].join(', '); }); }))
      .then(function (rotos) { rotos = rotos.filter(Boolean); if (rotos.length) throw new Error(rotos.length + ' rotos: ' + rotos.join(' · ')); cierto(lista.length >= 30, 'se revisaron ' + lista.length); });
  });
});

});

(function () {
  var res = document.getElementById('resultados'), ok = 0, fallos = 0, grupoActual = null;
  var cadena = Promise.resolve();
  PRUEBAS.forEach(function (p) {
    cadena = cadena.then(function () {
      if (p.grupo !== grupoActual) { grupoActual = p.grupo; var h = document.createElement('h2'); h.textContent = p.grupo; res.appendChild(h); }
      var linea = document.createElement('div');
      return Promise.resolve().then(p.fn).then(function () {
        ok++; linea.className = 'ok'; linea.textContent = '✓ ' + p.nombre;
      }, function (e) {
        fallos++; linea.className = 'fallo'; linea.textContent = '✗ ' + p.nombre + ' — ' + (e && e.message);
      }).then(function () { res.appendChild(linea); });
    });
  });
  cadena.then(function () {
    var r = document.getElementById('resumen');
    r.textContent = (fallos ? 'FALLOS ' : 'OK ') + ok + '/' + (ok + fallos);
    r.className = fallos ? 'fallo' : 'ok';
    document.title = r.textContent;
  });
})();
